<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - SAFARI</title>
    <link rel="stylesheet" th:href="@{/css/tabler.min.css?v=1.6.2}">
    <link rel="stylesheet" th:href="@{/css/styles.css?v=1.6.2}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/navigation :: sidebar('sales')}"></aside>
    <header class="topbar">
        <div class="brand">
            <h1>Ventas y salidas</h1>
            <small>Venta de mostrador · sin registro de cliente</small>
        </div>
    </header>

    <div class="alert-box" th:if="${error != null}" th:text="${error}"></div>
    <div class="notice success-notice" th:if="${mensaje != null}" th:text="${mensaje}"></div>

    <div class="layout">
        <section class="panel">
            <h2>Registrar venta</h2>
            <p class="muted-copy">El precio se toma del precio actual del producto. La venta descuenta existencias automáticamente.</p>
            <form th:action="@{/salidas/guardar}" method="post" class="form-grid">
                <div class="field">
                    <label for="productoId">Producto</label>
                    <select id="productoId" name="productoId" required>
                        <option value="">Selecciona producto con existencias</option>
                        <option th:each="p : ${productos}" th:if="${p.stockActual > 0}"
                                th:value="${p.id}"
                                th:text="${p.codigo + ' · ' + p.nombre + ' — disponible: ' + p.stockActual + ' — $' + #numbers.formatDecimal(p.precioActual, 1, 2)}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="cantidad">Cantidad</label>
                    <input id="cantidad" type="number" name="cantidad" min="1" value="1" required>
                </div>
                <div class="field">
                    <label for="observaciones">Observaciones</label>
                    <input id="observaciones" type="text" name="observaciones" maxlength="1000">
                </div>
                <button class="btn btn-primary" type="submit" th:disabled="${#lists.isEmpty(productos)}">Cobrar y registrar salida</button>
            </form>
        </section>

        <section class="panel">
            <h2>Historial de ventas</h2>
            <div class="table-wrap">
                <table class="table table-vcenter data-table">
                    <thead>
                    <tr><th>Fecha</th><th>Producto</th><th>Cantidad</th><th>Total</th><th>Atendió</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(detalles)}">
                        <td class="empty-state" colspan="5">Todavía no hay ventas registradas.</td>
                    </tr>
                    <tr th:each="d : ${detalles}">
                        <td th:text="${d.salida.fechaSalida != null ? #temporals.format(d.salida.fechaSalida, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                        <td th:text="${d.producto.codigo + ' · ' + d.producto.nombre}"></td>
                        <td th:text="${d.cantidad}"></td>
                        <td class="price-cell" th:text="${#numbers.formatDecimal(d.salida.montoTotal, 1, 2)}"></td>
                        <td th:text="${d.salida.usuario.nombre}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
</body>
</html>
